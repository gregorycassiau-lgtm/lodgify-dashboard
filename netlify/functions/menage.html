<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planning ménage</title>
<style>
  :root{--navy:#1F3B5C;--blue:#2E6CA4;--green:#1D9E75;--grey:#5A5F66;--border:#E2E5EA;
        --bg:#F7F8FA;--red:#C0392B;--amber:#BA7517;--lightgreen:#E3F1E7;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#222;background:var(--bg);padding:16px;max-width:560px;margin:0 auto;}
  h1{font-size:21px;color:var(--navy);margin-bottom:2px;}
  .sub{color:var(--grey);font-size:13px;margin-bottom:18px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--grey);margin-bottom:12px;}
  .bigbtn{display:block;width:100%;padding:16px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px;color:#fff;}
  .b-green{background:var(--green);}
  .b-amber{background:var(--amber);}
  .b-green:active{background:#17805e;}.b-amber:active{background:#9c6213;}
  .prod{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);font-size:15px;}
  .prod input{width:20px;height:20px;}
  textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;margin-top:10px;resize:vertical;min-height:52px;}
  .hidden{display:none;}
  .plan li{list-style:none;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .plan li:last-child{border-bottom:none;}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;}
  .t-express{background:#FCEBEB;color:var(--red);}
  .t-soon{background:#FAEEDA;color:#854F0B;}
  .muted{color:var(--grey);font-size:12.5px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;z-index:50;}
  .toast.show{opacity:1;}
  .loading{text-align:center;color:var(--grey);padding:30px;}
  .err{color:var(--red);text-align:center;padding:30px;}
</style>
</head>
<body>
<h1 id="titre">Planning ménage</h1>
<div class="sub" id="sub">Chargement…</div>

<div class="card">
  <h2>Signaler l'état de la maison</h2>
  <button class="bigbtn b-green" onclick="maisonPrete(this)">✅ La maison est prête</button>
  <button class="bigbtn b-amber" onclick="toggleProduits()">🧴 Il manque des produits</button>

  <div id="produitsBox" class="hidden" style="margin-top:8px">
    <div id="prodList"></div>
    <textarea id="autreProduit" placeholder="Autre chose à signaler (facultatif)…"></textarea>
    <button class="bigbtn b-amber" style="margin-top:10px" onclick="envoyerManque(this)">Envoyer la liste</button>
  </div>
</div>

<div class="card">
  <h2>🧹 Prochains ménages</h2>
  <ul class="plan" id="plan"><div class="loading">Chargement du planning…</div></ul>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== Configuration =====
const SUPABASE_URL = "https://yzwvcohhbphbjzizdypz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6d3Zjb2hoYnBoYmp6aXpkeXB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMDAwNjQsImV4cCI6MjEwMzY3NjA2NH0.VICwatNyWXWTPeLOoKFPJpFhE9CcHQuVhn0rL1l2GsY";
// ⚠️ À REMPLACER par ton numéro WhatsApp au format international, sans "+" ni espaces.
// Exemple pour la France : 33612345678
const WHATSAPP_NUMERO = "33635278516";

const PRODUITS = ["Liquide vaisselle","Éponges","Sacs poubelle","Papier toilette","Lessive","Essuie-tout","Produit sol / multi-usage","Sel / poivre / café"];

// ===== Identifie la maison depuis l'URL (/menage/royan ou /menage/bordeaux) =====
const path = location.pathname.replace(/\/+$/,"");
const slug = (path.split("/").pop() || "").toLowerCase();
const MAISONS = {
  royan:    { label:"Gîte de Royan",            match:["plage","royan","jaccuzi","jacuzzi"] },
  bordeaux: { label:"Maison de Bordeaux",       match:["architecte","bordeaux","piscine"] },
};
const maison = MAISONS[slug];

document.getElementById("prodList").innerHTML = PRODUITS.map((p,i)=>
  `<label class="prod"><input type="checkbox" value="${p}"> ${p}</label>`).join("");

if(!maison){
  document.getElementById("sub").textContent="";
  document.getElementById("titre").textContent="Page introuvable";
  document.querySelector("body").innerHTML=`<div class="err">Adresse incorrecte.<br>Utilise le lien fourni (…/menage/royan ou …/menage/bordeaux).</div>`;
}else{
  document.getElementById("titre").textContent="Planning ménage — "+maison.label;
  document.getElementById("sub").textContent="Merci pour ton aide ☀️";
  chargerPlanning();
}

// ===== Toast =====
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600);}

// ===== Enregistre dans Supabase =====
async function enregistrer(payload){
  try{
    await fetch(SUPABASE_URL+"/rest/v1/signalements",{
      method:"POST",
      headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},
      body:JSON.stringify(payload)
    });
  }catch(e){/* on continue quand même vers WhatsApp */}
}

// ===== Ouvre WhatsApp pré-rempli =====
function whatsapp(texte){
  const url="https://wa.me/"+WHATSAPP_NUMERO+"?text="+encodeURIComponent(texte);
  window.open(url,"_blank");
}

// ===== Bouton "maison prête" =====
async function maisonPrete(btn){
  btn.disabled=true;
  await enregistrer({maison:slug,type:"maison_prete"});
  toast("Signalement enregistré ✅");
  whatsapp(`Bonjour ! ${maison.label} est prête ✅`);
  setTimeout(()=>btn.disabled=false,1500);
}

// ===== Manque de produits =====
function toggleProduits(){document.getElementById("produitsBox").classList.toggle("hidden");}
async function envoyerManque(btn){
  const coches=[...document.querySelectorAll("#prodList input:checked")].map(c=>c.value);
  const autre=document.getElementById("autreProduit").value.trim();
  if(coches.length===0 && !autre){toast("Coche au moins un produit");return;}
  btn.disabled=true;
  await enregistrer({maison:slug,type:"manque_produit",produits:coches,commentaire:autre||null});
  const liste=[...coches, ...(autre?[autre]:[])].map(p=>"- "+p).join("\n");
  toast("Liste envoyée ✅");
  whatsapp(`Bonjour ! Il manque des produits à ${maison.label} :\n${liste}`);
  setTimeout(()=>{btn.disabled=false;document.getElementById("produitsBox").classList.add("hidden");
    document.querySelectorAll("#prodList input:checked").forEach(c=>c.checked=false);
    document.getElementById("autreProduit").value="";},1500);
}

// ===== Planning depuis la fonction Netlify =====
const FR_MONTHS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS_C=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
function fmtDayW(iso){const d=new Date(iso+"T00:00:00");const[y,m,dd]=iso.split("-");return`${JOURS_C[d.getDay()]} ${+dd} ${FR_MONTHS[+m-1]}`;}

async function chargerPlanning(){
  try{
    const res=await fetch("/.netlify/functions/reporting",{cache:"no-store"});
    if(!res.ok)throw new Error("Erreur "+res.status);
    const data=await res.json();
    const prop=(data.properties||[]).find(p=>{
      const n=(p.name||"").toLowerCase();
      return maison.match.some(k=>n.includes(k));
    });
    if(!prop||!prop.turnovers||!prop.turnovers.length){
      document.getElementById("plan").innerHTML=`<div class="muted">Aucun ménage programmé pour l'instant.</div>`;return;
    }
    document.getElementById("plan").innerHTML=prop.turnovers.map(t=>{
      let arr,tag="";
      if(t.sameDay){arr=`arrivée le <b>jour même</b> (${fmtDayW(t.nextCheckin)})`;tag=`<span class="tag t-express">EXPRESS</span>`;}
      else if(t.nextCheckin){arr=`prochaine arrivée ${fmtDayW(t.nextCheckin)} — ${t.gapDays} j`;if(t.gapDays<=2)tag=`<span class="tag t-soon">${t.gapDays} j</span>`;}
      else arr="pas d'arrivée programmée ensuite";
      return `<li><b>Départ : ${fmtDayW(t.checkout)}</b>${tag}<div class="muted">→ ${arr}</div></li>`;
    }).join("");
  }catch(e){
    document.getElementById("plan").innerHTML=`<div class="err">Impossible de charger le planning.<br>${e.message}</div>`;
  }
}
</script>
</body>
</html>
